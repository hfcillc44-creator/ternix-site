<!doctype html><html><head><meta charset="utf-8"><title>Ternix logo concepts</title>
<style>
body{margin:0;font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.panel{padding:28px 32px;display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center}
.dark{background:#0d141c;color:#e8edf2}
.light{background:#f4f1ea;color:#0d141c}
.gold{color:#c9a46a}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin:0;width:100%;text-align:left}
.stack{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.word{font-weight:600;letter-spacing:.22em;font-size:36px;line-height:1;padding-left:.22em}
.sub{font-weight:400;letter-spacing:.32em;font-size:12px;opacity:.7;padding-left:.32em;margin-top:-4px}
.sizes{display:flex;align-items:flex-end;gap:18px}
.fav{width:32px;height:32px;border-radius:6px;background:#0f1720;display:grid;place-items:center}
.fav svg{width:24px;height:24px}
.lockup{display:flex;align-items:center;gap:16px}
.lockup .word{font-size:34px;padding:0}
</style></head><body>
<div class="panel dark"><h2>Chosen: gold tern, TERNIX. Dark</h2>
 <div class="stack gold"><svg width="140" height="140" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><div class="word" style="color:#e8edf2">TERNIX</div></div>
 <div class="lockup gold"><svg width="64" height="64" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><div class="word" style="color:#e8edf2">TERNIX</div></div>
</div>
<div class="panel light"><h2>Light and print</h2>
 <div class="stack" style="color:#b8893f"><svg width="140" height="140" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><div class="word" style="color:#0d141c">TERNIX</div></div>
 <div class="stack" style="color:#0d141c"><svg width="140" height="140" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><div class="word">TERNIX</div></div>
</div>
<div class="panel dark"><h2>Mark alone, sizes 180 / 64 / 32 / 16, favicon tile, horizontal lockup</h2>
 <div class="sizes"><svg width="180" height="180" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><svg width="64" height="64" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><svg width="32" height="32" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><svg width="16" height="16" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><div class="fav"><svg viewBox="0 0 200 200" fill="#c9a46a"><use href="#A"/></svg></div></div>
 <div class="lockup"><svg width="64" height="64" viewBox="0 0 200 200" fill="currentColor"><use href="#A"/></svg><div class="word">TERNIX</div></div>
</div>

</body></html>
